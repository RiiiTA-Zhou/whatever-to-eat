services:
  api:
    build: .
    container_name: whatever-to-eat-api
    command: uvicorn src.api:app --reload --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./user_memory:/app/user_memory
      - ./.env:/app/.env
    environment:
      - PYTHONPATH=/app/src
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: whatever-to-eat-frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
